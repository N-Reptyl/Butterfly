[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "http://choeur-butterfly.com/*"
  to = "https://choeur-butterfly.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.choeur-butterfly.com/*"
  to = "https://choeur-butterfly.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-store, max-age=0, must-revalidate"